# English labels for existing built-in catalog records. Keys and user data are unchanged.
Database\ đã\ có\ dữ\ liệu,\ bỏ\ qua\ bước\ nạp\ dữ\ liệu\ mẫu=Database\ already\ contains\ data;\ skipping\ sample\ data\ import
Đã\ nạp\ dữ\ liệu\ mẫu\:\ {}\ loại,\ {}\ linh\ kiện,\ {}\ bộ\ máy=Loaded\ sample\ data\:\ {}\ categories,\ {}\ components,\ {}\ PC\ builds
Vỏ\ máy\ (case)=PC\ case
Giữ\ và\ bảo\ vệ\ mọi\ linh\ kiện\ bên\ trong,\ có\ chỗ\ gắn\ quạt\ để\ lấy\ gió.=Holds\ and\ protects\ the\ components,\ with\ fan\ mounts\ for\ cooling.
Bo\ mạch\ chủ=Motherboard
Tấm\ mạch\ lớn\ nối\ mọi\ linh\ kiện\ với\ nhau.\ Mỗi\ linh\ kiện\ có\ một\ khe\ cắm\ riêng\ trên\ tấm\ này.=The\ main\ circuit\ board\ connects\ all\ the\ components.\ Each\ type\ has\ its\ own\ socket\ or\ slot.
CPU\ (bộ\ xử\ lý)=CPU\ (processor)
Bộ\ não\ của\ máy.\ Nằm\ ngay\ dưới\ tản\ nhiệt.=Processes\ instructions\ and\ sits\ beneath\ the\ CPU\ cooler.
Tản\ nhiệt\ CPU=CPU\ cooler
Hút\ nhiệt\ từ\ CPU\ ra\ ngoài\ để\ máy\ không\ bị\ quá\ nóng.=Removes\ heat\ from\ the\ CPU\ to\ prevent\ overheating.
Bộ\ nhớ\ tạm.\ Càng\ nhiều\ thì\ mở\ được\ càng\ nhiều\ chương\ trình\ cùng\ lúc.=Temporary\ working\ memory.\ More\ RAM\ lets\ you\ run\ more\ programs\ at\ once.
Card\ đồ\ họa\ (GPU)=Graphics\ card\ (GPU)
Xử\ lý\ hình\ ảnh.\ Cần\ cho\ chơi\ game,\ dựng\ phim\ và\ làm\ 3D.=Handles\ graphics\ for\ gaming,\ video\ editing\ and\ 3D\ work.
Ổ\ SSD=SSD
Nơi\ lưu\ hệ\ điều\ hành,\ phần\ mềm\ và\ dữ\ liệu\ của\ bạn.=Stores\ your\ operating\ system,\ programs\ and\ files.
Nguồn\ (PSU)=Power\ supply\ (PSU)
Lấy\ điện\ từ\ ổ\ cắm\ rồi\ chia\ cho\ từng\ linh\ kiện.=Converts\ mains\ electricity\ into\ power\ for\ the\ components.
Dây\ cáp=Cables
Dây\ nguồn\ đen\ to\ đưa\ điện\ tới\ bo\ mạch\ (24\ pin),\ CPU\ (8\ pin)\ và\ card\ đồ\ họa\ (PCIe).\ Dây\ quạt\ nhỏ\ cắm\ vào\ các\ cổng\ FAN\ trên\ bo.\ Bó\ dây\ nhiều\ màu\ từ\ nút\ nguồn\ cắm\ vào\ cổng\ F_PANEL\ ở\ góc\ dưới\ bên\ phải,\ dây\ xanh\ dẹt\ là\ USB\ mặt\ trước.=Thick\ power\ cables\ feed\ the\ motherboard\ (24-pin),\ CPU\ (8-pin)\ and\ GPU\ (PCIe).\ Fan\ cables\ use\ FAN\ headers.\ Case\ button\ leads\ connect\ to\ F_PANEL;\ the\ blue\ cable\ connects\ front\ USB.
Quạt\ case=Case\ fans
Đưa\ gió\ mát\ vào\ và\ đẩy\ gió\ nóng\ ra\ khỏi\ thùng\ máy.=Bring\ cool\ air\ into\ the\ case\ and\ push\ warm\ air\ out.
Đồ\ nghề\ lắp\ máy=Assembly\ tools
Những\ thứ\ cần\ cầm\ trên\ tay\ khi\ tự\ lắp\:\ tua\ vít,\ dây\ chống\ tĩnh\ điện,\ keo\ tản\ nhiệt,\ hộp\ vít,\ dây\ rút,\ kìm\ cắt\ và\ dây\ điện.\ Bấm\ "Tách\ rời\ linh\ kiện"\ để\ thấy\ cả\ bộ\ bày\ trên\ thảm\ cạnh\ máy.=Tools\ for\ assembly\:\ a\ screwdriver,\ anti-static\ strap,\ thermal\ paste,\ screw\ organiser,\ cable\ ties,\ cutters\ and\ power\ cable.\ Select\ Explode\ view\ to\ see\ them\ beside\ the\ PC.
