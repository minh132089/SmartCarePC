spring.application.name=smartcarepc-backend

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/smartcarepc
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Chỉ đọc dữ liệu trong service (@Transactional), không mở session suốt request
spring.jpa.open-in-view=false

# Trợ lý AI trong khung chat (Claude). Khoá đặt bằng biến môi trường, không ghi vào file này.
# Không có khoá thì /api/chat trả 503 kèm lời nhắc, các API khác vẫn chạy bình thường.
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-sonnet-5-5}
app.ai.max-tokens=1024
