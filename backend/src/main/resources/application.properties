spring.application.name=smartcarepc-backend

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/smartcarepc
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Chỉ đọc dữ liệu trong service (@Transactional), không mở session suốt request
spring.jpa.open-in-view=false

# Trợ lý AI trong khung chat: API chuẩn OpenAI, mặc định DeepSeek V4 qua AgentRouter.
# Khoá đặt bằng biến môi trường AI_API_KEY, không ghi vào file này.
# Không có khoá thì /api/chat trả 503 kèm lời nhắc, các API khác vẫn chạy bình thường.
# Đọc thêm biến từ file backend/.env nếu có (file này nằm trong .gitignore, chỉ có trên máy mình).
# Ví dụ nội dung: AI_API_KEY=sk-...   AI_MODEL=...   AI_BASE_URL=...
spring.config.import=optional:file:.env[.properties]
app.ai.base-url=${AI_BASE_URL:https://agentrouter.org/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:deepseek-v4-flash}
app.ai.max-tokens=2048

# Nguồn phụ khi engine so giá tìm được ít: Serper.dev (Google Shopping). Không bắt buộc; khoá đặt trong backend/.env:
# SERPER_API_KEY=...
app.search.serper-key=${SERPER_API_KEY:}
# Engine so giá tự chạy (service/price): đọc thẳng web cửa hàng + SearXNG trên máy (tools/demo.sh tự bật bằng Docker).
# Serper ở trên chỉ còn là nguồn phụ khi engine tìm được ít.
app.search.engine=${PRICE_ENGINE:true}
app.search.searxng-url=${SEARXNG_URL:http://localhost:8888}

# Thử nghiệm 4 tuần: nhóm nghiên cứu tải phản hồi tại /api/feedback/export.csv?key=...
# Đặt khoá trong backend/.env: FEEDBACK_EXPORT_KEY=... Để trống thì không ai tải được.
app.feedback.export-key=${FEEDBACK_EXPORT_KEY:}
