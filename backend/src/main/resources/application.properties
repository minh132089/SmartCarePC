spring.application.name=smartcarepc-backend

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/smartcarepc
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Chỉ đọc dữ liệu trong service (@Transactional), không mở session suốt request
spring.jpa.open-in-view=false

# Trợ lý AI trong khung chat: API chuẩn OpenAI, mặc định DeepSeek V4 qua AgentRouter.
# Khoá đặt bằng biến môi trường AI_API_KEY, không ghi vào file này.
# Không có khoá thì /api/chat trả 503 kèm lời nhắc, các API khác vẫn chạy bình thường.
# Đọc thêm biến từ file backend/.env nếu có (file này nằm trong .gitignore, chỉ có trên máy mình).
# Ví dụ nội dung: AI_API_KEY=sk-...   AI_MODEL=...   AI_BASE_URL=...
spring.config.import=optional:file:.env[.properties]
app.ai.base-url=${AI_BASE_URL:https://agentrouter.org/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:deepseek-v4-flash}
app.ai.max-tokens=4096
# Tắt chế độ suy nghĩ của model (DeepSeek: thinking = disabled); bật suy nghĩ thì có thể trả lời rỗng vì hết token
app.ai.disable-thinking=${AI_DISABLE_THINKING:false}

# Nguồn bổ sung khi engine so giá tìm được ít: Serper.dev (Google Shopping). Khoá đặt trong backend/.env:
# SERPER_API_KEY=...; SERPER_API_KEY_BACKUP=... dùng tự động khi khoá chính hết lượt.
app.search.serper-key=${SERPER_API_KEY:}
app.search.serper-backup-key=${SERPER_API_KEY_BACKUP:}
# Engine so giá tự chạy (service/price): đọc thẳng web cửa hàng + SearXNG trên máy (tools/demo.sh tự bật bằng Docker).
# Là nguồn tìm sản phẩm chính: link, giá và tình trạng hàng đọc thẳng từ trang cửa hàng.
app.search.engine=${PRICE_ENGINE:true}
# Kho giá: ứng viên tìm ngay từ sản phẩm đã thấy trong 12 giờ, làm mới ở nền. PRICE_INDEX=false để tắt (tìm thật như trước)
app.search.index=${PRICE_INDEX:true}
app.search.searxng-url=${SEARXNG_URL:http://localhost:8888}

# Thử nghiệm 4 tuần: nhóm nghiên cứu tải phản hồi tại /api/feedback/export.csv?key=...
# Đặt khoá trong backend/.env: FEEDBACK_EXPORT_KEY=... Để trống thì không ai tải được.
app.feedback.export-key=${FEEDBACK_EXPORT_KEY:}

# Email nhắc bảo dưỡng cho người đã đăng nhập (tự bật, phải bấm link xác nhận trong thư trước khi nhận nhắc).
# Gửi bằng Gmail của nhóm: bật xác minh 2 bước, tạo App Password rồi đặt trong backend/.env:
# MAIL_USERNAME=...@gmail.com   MAIL_PASSWORD=<App Password 16 ký tự>
# Để trống thì tính năng tắt: web ẩn lựa chọn email, không gửi gì.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Kiểm tra lịch mỗi giờ từ 8:00 tới 20:00 giờ Việt Nam. Tự lặp theo chu kỳ từng việc (bụi 6 tháng, keo 30 tháng, kiểm tra 1 tháng);
# mỗi lần tới hạn gửi tối đa 2 thư (đúng hạn và 7 ngày sau)
app.reminders.cron=${REMINDER_CRON:0 0 8-20 * * *}
app.reminders.zone=${REMINDER_ZONE:Asia/Ho_Chi_Minh}
# Khoá ký bằng chứng "Google đã xác minh email" (ít nhất 16 ký tự). Để trống thì tạo ngẫu nhiên mỗi lần khởi động:
# người đăng nhập Google trước lần khởi động lại sẽ phải bấm link xác nhận trong thư. EMAIL_PROOF_SECRET=...
app.reminders.proof-secret=${EMAIL_PROOF_SECRET:}
# Link tải app khay Windows SmartCarePC Helper, chỉ có trong email kiểm tra sức khoẻ hằng tháng. Link của web, public/_redirects
# chuyển tiếp sang GitHub Releases (file cài tên SmartCarePCHelper-Setup.exe, repo phải public).
# Đặt HELPER_DOWNLOAD_URL= (trống) để bỏ phần này.
app.reminders.helper-url=${HELPER_DOWNLOAD_URL:https://smartcarepc.pages.dev/download/helper}
# Link trong thư chỉ trỏ về các địa chỉ web này
app.reminders.origins=https://smartcarepc.pages.dev,http://localhost:5173
